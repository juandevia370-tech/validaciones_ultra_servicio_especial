<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    # El proxy de la plataforma termina HTTPS y lo informa con X-Forwarded-Proto
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Las carpetas apps/ y config/ quedan fuera de la raíz web
    <Directory /var/www/html>
        Options -Indexes
        AllowOverride None
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
