# Blueprint de Render: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: ultra-servicio-especial
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DB_DRIVER
        value: pgsql
      # Supabase > Connect > "Session pooler" (compatible con IPv4)
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SCHEMA
        value: transporte
      - key: DB_SSLMODE
        value: require
